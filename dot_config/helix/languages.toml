# Language Servers

[language-server.rust-analyzer.config]
rust_analyzer.rustc.source = "discover"

[language-server.lalrpop]
command = "lalrpop-lsp"

[language-server.tinymist]
command = "tinymist"
config = { preview.background.enabled = true, preview.background.args = ["--data-plane-host=127.0.0.1:23635", "--invert-colors=never", "--open"] }

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[language-server.harper-ls.config.harper-ls.linters]
LongSentences = false

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[language-server.typescript-language-server.config]
tsserver = { path = "/usr/lib/node_modules/typescript/lib/" } # Ensure usage of global tsc version.
preferences = { includeInlayVariableTypeHints = true }

# Languages
[[language]]
name = "rust"
language-servers = ["rust-analyzer"]

[[language]]
name = "bibtex"
formatter = { command = "bibtex-tidy", args = [
  "-",
  "--curly",
  "--remove-empty-fields",
  "--sort-fields",
  "--no-sort",
  "--trailing-commas", 
]}
 
[[language]]
name = "typescript"
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
auto-format = true

[[language]]
name = "typst"
language-servers = ["tinymist", "harper-ls"]
formatter = { command = "typstyle", args = ["--line-width", "100"] }
soft-wrap.enable = true

[[language]]
name = "rust"
auto-format = true

[[language]]
auto-format = true
language-servers = ["marksman", "mpls"]
name = "markdown"

[language-server.mpls]
command = "mpls"
args = ["--theme", "tokyonight", "--enable-emoji"]

[[language]]
name = "lalrpop"
file-types = ["lalrpop"]
scope = "source.lalrpop"
language-servers = ["lalrpop"]

[[grammar]]
name = "lalrpop"
source = { git = "https://github.com/traxys/tree-sitter-lalrpop", rev = "8d38e9755c05d37df8a24dadb0fc64f6588ac188" }
